<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="Georgia, serif" font-size="13">
  <!-- Scale: 10 px = 1 m. Plot 20 m x 50 m = 1,000 m². Plot origin at (60,110). Beach at top, road at bottom. -->
  <rect width="640" height="720" fill="#f6f1e7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" fill="#3b3227">SITE PLAN — 1,000 m² (v4)</text>
  <text x="320" y="50" text-anchor="middle" fill="#7a6b58">Plot ≈ 20 m × 50 m · 1 square = 5 m</text>

  <!-- Beach + drop -->
  <rect x="20" y="60" width="280" height="30" fill="#e9d9b4"/>
  <text x="160" y="80" text-anchor="middle" fill="#7a6b58">BEACH (lower level)</text>
  <rect x="60" y="90" width="200" height="20" fill="#cdbf9f"/>
  <text x="310" y="80" fill="#7a6b58">drop / steps down</text>

  <defs>
    <pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#e3dccd" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="60" y="110" width="200" height="500" fill="#cfe0b5"/>
  <rect x="60" y="110" width="200" height="500" fill="url(#g)"/>

  <!-- Perimeter: hedge (inner) + stone wall (outer) -->
  <rect x="56" y="106" width="208" height="508" fill="none" stroke="#a69a85" stroke-width="4"/>
  <rect x="60" y="110" width="200" height="500" fill="none" stroke="#4f6b3a" stroke-width="10"/>

  <!-- Back gate + steps (aligned with beach path) -->
  <rect x="119" y="88" width="26" height="14" fill="#bfb39a"/>
  <path d="M121 91h22M121 95h22M121 99h22" stroke="#8d806b"/>
  <rect x="100" y="103" width="64" height="14" fill="#4a3424"/>
  <path d="M100 117 Q132 133 164 117" fill="#4a3424"/>
  <text x="185" y="100" font-size="9" fill="#3b3227">BEACH GATE (identical to main</text>
  <text x="185" y="111" font-size="9" fill="#3b3227">gate · solid, arched, 3 m tall)</text>

  <!-- Backyard -->
  <text x="205" y="170" text-anchor="middle" fill="#3b3227">BACKYARD</text>
  <text x="205" y="186" text-anchor="middle" fill="#5d6e4a" font-size="10">lawn · BBQ / play</text>
  <rect x="124" y="118" width="16" height="122" fill="#e2d6bd"/>
  <path d="M118 125V235M146 125V235" stroke="#9b7fc0" stroke-width="4" stroke-dasharray="4 4"/>

  <!-- Covered terrace: same width as house -->
  <rect x="77" y="240" width="110" height="30" fill="#e6c9a8" stroke="#a7795a"/>
  <text x="132" y="259" text-anchor="middle" font-size="9" fill="#3b3227">COVERED ARCHED TERRACE</text>

  <!-- Foot rinse -->
  <circle cx="153" cy="234" r="5" fill="#7fb2c9"/>
  <text x="161" y="230" font-size="9" fill="#3b3227">foot rinse</text>

  <!-- House (centred block: house 11 m + garage 5.5 m) -->
  <rect x="77" y="270" width="110" height="130" fill="#f2e6cf" stroke="#8a6a4b" stroke-width="2"/>
  <text x="132" y="330" text-anchor="middle" font-size="14" fill="#3b3227">HOUSE</text>
  <text x="132" y="346" text-anchor="middle" font-size="10" fill="#7a6b58">2 floors · ≈ 11 × 13 m</text>

  <!-- Laundry / drying behind garage -->
  <rect x="187" y="270" width="55" height="50" fill="#d8d2c4" stroke="#8a6a4b" stroke-width="2"/>
  <text x="214" y="291" text-anchor="middle" font-size="9" fill="#3b3227">LAUNDRY /</text>
  <text x="214" y="303" text-anchor="middle" font-size="9" fill="#3b3227">DRYING</text>
  <text x="214" y="314" text-anchor="middle" font-size="8" fill="#7a6b58">5.5 × 5 m</text>

  <!-- Garage -->
  <rect x="187" y="320" width="55" height="80" fill="#e8dcc4" stroke="#8a6a4b" stroke-width="2"/>
  <text x="214" y="358" text-anchor="middle" font-size="10" fill="#3b3227">GARAGE</text>
  <text x="214" y="370" text-anchor="middle" font-size="8" fill="#7a6b58">5.5 × 8 m</text>

  <!-- Front door (aligned with plot centre / gate) -->
  <rect x="150" y="396" width="20" height="8" fill="#5a3f2a"/>

  <!-- Front walk: narrow straight stepping-stone path, front door → gate -->
  <rect x="155" y="404" width="10" height="200" fill="#c9c6bd"/>
  <path d="M156 412h8M156 424h8M156 436h8M156 448h8M156 460h8M156 472h8M156 484h8M156 496h8M156 508h8M156 520h8M156 532h8M156 544h8M156 556h8M156 568h8M156 580h8M156 592h8" stroke="#9fae86" stroke-width="2"/>
  <path d="M150 412V596M170 412V556" stroke="#9b7fc0" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Driveway: garage → straight down right side → curves into right half of gate -->
  <path d="M214 400 L214 560 Q214 596 180 606 L178 610"
        fill="none" stroke="#d9cfb8" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Columnar Thuja, symmetric on both sides of the straight driveway -->
  <g fill="#3f6b2c" stroke="#2c4d1f" stroke-width="1">
    <circle cx="197" cy="430" r="5"/><circle cx="197" cy="460" r="5"/><circle cx="197" cy="490" r="5"/><circle cx="197" cy="520" r="5"/><circle cx="197" cy="550" r="5"/>
    <circle cx="231" cy="430" r="5"/><circle cx="231" cy="460" r="5"/><circle cx="231" cy="490" r="5"/><circle cx="231" cy="520" r="5"/><circle cx="231" cy="550" r="5"/>
  </g>

  <!-- Front lawn + picnic tree -->
  <text x="112" y="450" text-anchor="middle" fill="#3b3227">FRONT LAWN</text>
  <circle cx="112" cy="515" r="28" fill="#5e7f41" opacity="0.85"/>
  <text x="112" y="519" text-anchor="middle" font-size="9" fill="#fff">PICNIC TREE</text>

  <!-- Lavender + roses along the full hedge line (side strips now free on both sides) -->
  <path d="M68 120V600M252 120V600M68 600H128M192 600H252M68 120H100M164 120H252" stroke="#9b7fc0" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M73 125V595M247 125V595M73 595H128M192 595H247M73 125H100M164 125H247" stroke="#d97a96" stroke-width="2.5" stroke-dasharray="2 6"/>

  <!-- Front gate (centred on plot, ≈6.4 m: footpath enters left half, driveway right half) -->
  <rect x="128" y="604" width="64" height="14" fill="#4a3424"/>
  <path d="M128 604 Q160 588 192 604" fill="#4a3424"/>
  <text x="160" y="640" text-anchor="middle" fill="#3b3227">MAIN GATE (solid, arched, 3 m tall)</text>
  <text x="160" y="660" text-anchor="middle" fill="#7a6b58">ROAD</text>

  <!-- Side-margin callouts -->
  <g font-size="9" fill="#7a6b58">
    <text x="78" y="420" transform="rotate(-90 78 420)">≈1.2 m</text>
    <text x="250" y="300" transform="rotate(-90 250 300)">≈1.2 m</text>
  </g>

  <!-- Section labels -->
  <g font-size="11" fill="#7a6b58">
    <text x="278" y="180">≈ 13 m backyard</text>
    <text x="278" y="335">≈ 16 m house + terrace</text>
    <text x="278" y="510">≈ 21 m front garden</text>
  </g>
  <path d="M270 115V237M270 243V397M270 403V605" stroke="#b9ad97" stroke-width="2"/>

  <!-- Changes -->
  <g transform="translate(400 120)" font-size="12" fill="#3b3227">
    <text y="0" font-size="14">Changes in v3</text>
    <text y="24">• Narrow straight stepping-stone</text>
    <text y="40" x="10">walk (≈1 m) front door → gate</text>
    <text y="60">• Front door moved to plot centre,</text>
    <text y="76" x="10">in line with the gate</text>
    <text y="96">• Columnar Thuja both sides of the</text>
    <text y="112" x="10">straight driveway, symmetric</text>
    <text y="132">• Driveway no longer branches to</text>
    <text y="148" x="10">the door; gate widened to ≈6.4 m</text>
  </g>

  <!-- Legend -->
  <g transform="translate(400 300)" font-size="12" fill="#3b3227">
    <text y="0" font-size="14">LEGEND</text>
    <rect y="14" width="16" height="10" fill="#4f6b3a"/><text x="24" y="23">Boxy hedge · 3 m tall (inside wall)</text>
    <rect y="34" width="16" height="10" fill="none" stroke="#a69a85" stroke-width="3"/><text x="24" y="43">Low stone wall · ≈1–1.5 m (outside)</text>
    <path d="M0 58h16" stroke="#9b7fc0" stroke-width="4" stroke-dasharray="4 4"/><text x="24" y="62">Lavender</text>
    <path d="M0 78h16" stroke="#d97a96" stroke-width="3" stroke-dasharray="2 6"/><text x="24" y="82">Roses</text>
    <rect y="94" width="16" height="10" fill="#d9cfb8"/><text x="24" y="103">Driveway</text>
    <rect y="114" width="16" height="10" fill="#e2d6bd"/><text x="24" y="123">Footpath to beach</text>
    <rect y="134" width="16" height="10" fill="#c9c6bd"/><text x="24" y="143">Stepping-stone front walk</text>
    <circle cx="8" cy="159" r="5" fill="#3f6b2c" stroke="#2c4d1f"/><text x="24" y="163">Columnar Thuja (driveway)</text>
    <circle cx="8" cy="179" r="6" fill="#7fb2c9"/><text x="24" y="183">Foot rinse</text>
  </g>
</svg>
